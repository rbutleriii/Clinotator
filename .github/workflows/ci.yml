name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.9', '3.8', '3.6', '3.7']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: clinotator/clinotator.py -t vid -e A.N.other@example.com test/test.vid
      - run: clinotator/clinotator.py -t rsid -e A.N.other@example.com test/test.rsid
      - run: clinotator/clinotator.py -t vcf -e A.N.other@example.com test/test.vcf